# stack-version: 0.1.0
name: stack-ci (reusable)
on:
  workflow_call:
    inputs:
      node-version:        { type: string, default: "22" }
      pnpm-version:        { type: string, default: "9.15.9" }
      install-cmd:         { type: string, default: "pnpm install --frozen-lockfile" }
      lint-cmd:            { type: string, default: "pnpm exec turbo run lint typecheck" }
      test-cmd:            { type: string, default: "pnpm test" }
      build-cmd:           { type: string, default: "pnpm run build" }
      affected-lint:       { type: boolean, default: true }   # PR fast-path: turbo --affected
      build-on-main-only:  { type: boolean, default: true }
      node-max-old-space:  { type: string, default: "8192" }
      runs-on:             { type: string, default: "ubuntu-latest" }
jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install pnpm via corepack
        run: corepack enable && corepack prepare pnpm@${{ inputs.pnpm-version }} --activate
      - name: Install
        run: ${{ inputs.install-cmd }}
      - name: Lint + typecheck (affected)
        if: github.event_name == pull_request && inputs.affected-lint
        env:
          NODE_OPTIONS: --max-old-space-size=${{ inputs.node-max-old-space }}
          BASE_REF: ${{ github.base_ref }}
        run: ${{ inputs.lint-cmd }} --filter="...[origin/$BASE_REF]"
      - name: Lint + typecheck (full)
        if: github.event_name != pull_request || !inputs.affected-lint
        env:
          NODE_OPTIONS: --max-old-space-size=${{ inputs.node-max-old-space }}
        run: ${{ inputs.lint-cmd }}
      - name: Test
        run: ${{ inputs.test-cmd }}
      - name: Build
        if: github.event_name != pull_request || !inputs.build-on-main-only
        run: ${{ inputs.build-cmd }}
